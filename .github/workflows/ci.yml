name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  action:
    name: Action on the demo site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run ux-validate (this repository's action)
        id: ux
        uses: ./
        with:
          start: npx --yes http-server examples/demo-site -p 4321 -s
          url: http://localhost:4321/index.html
          # O site de demonstração tem problemas de propósito: aqui só conferimos que a Action funciona.
          fail-on: ''
      - name: Check the action's outputs
        env:
          ISSUES: ${{ steps.ux.outputs.issues }}
          SARIF: ${{ steps.ux.outputs.sarif-file }}
          REPORT: ${{ steps.ux.outputs.report-dir }}
        run: |
          echo "issues=$ISSUES"
          test "$ISSUES" -gt 20
          test -s "$SARIF"
          test -s "$REPORT/report.html"
          test -s "$REPORT/comment.md"
