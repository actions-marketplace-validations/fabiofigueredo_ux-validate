<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contato | NuvemFácil</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><nav><a href="index.html">Home</a><a href="planos.html">Pricing</a></nav></header>
<main>
  <h1>Fale conosco</h1>
  <p>Responderemos em até 2 dias úteis. Agradecemos a preferência e a paciencia.</p>
  <form onsubmit="event.preventDefault(); document.getElementById('ok').hidden=false">
    <input type="text" placeholder="Nome">
    <input type="email" placeholder="E-mail">
    <textarea placeholder="Mensagem"></textarea>
    <div onclick="this.closest('form').requestSubmit()" style="background:#eee;padding:8px;width:80px">Enviar</div>
  </form>
  <p id="ok" hidden>Mensagem enviada com sucesso!</p>
</main>
</body>
</html>
